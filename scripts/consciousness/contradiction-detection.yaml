# 矛盾表述检测意识脚本
# 用于检测用户对话中的矛盾表述，触发咨询师关注
#
# 存档 (Archived) — 早期配置格式实验，作为格式参考。
# 配置格式规范已整合到: docs/design/consciousness-system.md §4
# 存档日期: 2026-07-09

metadata:
  name: '矛盾表述检测'
  version: '1.0'
  author: 'HeartRule Team'
  description: '检测用户在对话中出现的矛盾表述，帮助咨询师识别认知失调或情绪冲突'
  consciousness_type: 'contradiction_detection'
  trigger_priority: 'medium' # low/medium/high/urgent

# 意识定义结构
consciousness:
  consciousness_id: 'contradiction_detection_v1'
  consciousness_name: '矛盾表述检测'

  # 触发条件配置
  trigger_config:
    trigger_timing: 'after_user_message' # after_user_message / after_ai_response / periodic
    cooldown_rounds: 3
    context_window:
      lookback_messages: 10
      min_messages_required: 3

  # 加载配置
  loading_config:
    scope: ['phase:assessment', 'phase:exploration']
    activation: 'conditional'
    priority: 0.7

  # 核心配置（脚本工程师编写业务逻辑）
  config:
    # 检测焦点（业务概念）
    detection_focus: '识别用户对话中的逻辑矛盾、情绪矛盾、价值观冲突或行为不一致'

    # 检测类型定义（业务逻辑）
    detection_types:
      - type: 'logical_contradiction'
        description: '逻辑矛盾：前后陈述在逻辑上不一致'
        examples:
          - '"我非常爱我的家人" 与 "我从不和家人联系"'
          - '"我从不焦虑" 与 "我每天都担心各种事情"'

      - type: 'emotional_contradiction'
        description: '情绪矛盾：言语内容与情绪表达不一致'
        examples:
          - '说"我很开心"但语气悲伤'
          - '说"我不在乎"但表现出强烈情绪'

      - type: 'value_conflict'
        description: '价值观冲突：不同陈述反映的价值观矛盾'
        examples:
          - '"家庭最重要" 与 "工作是我的全部"'
          - '"我重视健康" 与 "我从不锻炼"'

      - type: 'behavioral_inconsistency'
        description: '行为不一致：言语与描述的行为矛盾'
        examples:
          - '"我很外向" 与 "我总是独自一人"'
          - '"我善于社交" 与 "我害怕见人"'

    # 输出变量定义（从检测结果中提取）
    output:
      - get: 'contradiction_detected'
        define: '是否检测到矛盾（true/false）'

      - get: 'contradiction_type'
        define: '矛盾类型（logical_contradiction/emotional_contradiction/value_conflict/behavioral_inconsistency）'

      - get: 'statement_a'
        define: '构成矛盾的第一条陈述内容'

      - get: 'statement_b'
        define: '构成矛盾的第二条陈述内容'

      - get: 'confidence'
        define: '检测置信度（0.0-1.0）'

      - get: 'severity'
        define: '矛盾严重程度（0.0-1.0）'

      - get: 'clinical_significance'
        define: '从心理学角度解释这个矛盾的可能意义'

      - get: 'suggested_exploration'
        define: '建议咨询师如何温和地探索这个矛盾'

    # 阈值配置（业务参数）
    thresholds:
      confidence_threshold: 0.7
      severity_threshold: 0.5
      min_contradiction_count: 1

    # 排除规则（业务逻辑）
    exclusion_rules:
      - '时间跨度超过30天的陈述不视为矛盾'
      - '明显是比喻或修辞的表述不视为矛盾'
      - '用户已自我意识到的矛盾不重复报告'

    # LLM配置（技术参数）
    llm_config:
      model: 'claude-3-haiku'
      temperature: 0.3
      max_tokens: 1024

  # 性能优化
  performance_config:
    caching:
      enabled: true
      ttl_seconds: 300

    batching:
      enabled: true
      batch_size: 5

    sampling:
      enabled: true
      sample_rate: 0.3
      always_check: ['safety_keywords']

  # 输出配置
  output_config:
    output_format: 'structured'

    # 触发动作（当检测到矛盾时）
    trigger_actions:
      - action_type: 'log_event'
        config:
          event_type: 'contradiction_detected'
          log_level: 'info'

      - action_type: 'notify_session'
        config:
          notification_type: 'consciousness_alert'
          priority: 'medium'

  # 安全底线配置
  safety_baseline:
    keyword_check:
      enabled: true
      crisis_keywords:
        - '自杀'
        - '自残'
        - '不想活'
        - '结束生命'
      crisis_action: 'immediate_alert'

    failure_handling:
      fallback_strategy: 'skip'
      max_retries: 2
      retry_delay_ms: 1000

# 示例输入输出
examples:
  - description: '检测到逻辑矛盾'
    input:
      messages:
        - role: 'user'
          content: '我和父母关系很好，每周都会通话'
        - role: 'assistant'
          content: '听起来你和家人的关系很亲密'
        - role: 'user'
          content: '其实我已经三年没和父母说话了'
    expected_output:
      contradiction_detected: true
      contradiction_type: 'logical_contradiction'
      statement_a: '我和父母关系很好，每周都会通话'
      statement_b: '其实我已经三年没和父母说话了'
      confidence: 0.95
      severity: 0.8
      clinical_significance: '可能反映家庭关系认知的复杂性，值得进一步探索'

  - description: '未检测到矛盾'
    input:
      messages:
        - role: 'user'
          content: '我最近工作压力很大'
        - role: 'assistant'
          content: '能具体说说是什么让你感到压力吗？'
        - role: 'user'
          content: '项目deadline很紧，团队人手不够'
    expected_output:
      contradiction_detected: false
      confidence: 0.9
